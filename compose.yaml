name: game-of-inches

services:
  database:
    container_name: goi-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-game_of_inches}
      POSTGRES_USER: ${POSTGRES_USER:-game_of_inches}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
        restart: true
    environment:
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-game_of_inches}
      PGUSER: ${POSTGRES_USER:-game_of_inches}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      COMMISSIONER_PASSWORD_HASH: ${COMMISSIONER_PASSWORD_HASH:?Set COMMISSIONER_PASSWORD_HASH in .env}
      COMMISSIONER_SESSION_SECRET: ${COMMISSIONER_SESSION_SECRET:?Set COMMISSIONER_SESSION_SECRET in .env}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
